name: mehfooz
description: "Mehfooz — Civilian-first crisis companion for Pakistan"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.8
  firebase_messaging: ^15.2.6
  firebase_storage: ^12.4.5

  # Maps & location
  google_maps_flutter: ^2.12.1
  geolocator: ^13.0.2
  permission_handler: ^11.4.0

  # Media
  record: ^5.1.3                  # M8 — voice capture (AAC-LC, 16kHz)
  image_picker: ^1.1.2
  path_provider: ^2.1.5           # M8 — temp file for voice recording

  # Utilities
  url_launcher: ^6.3.1
  flutter_local_notifications: ^18.0.1
  intl: ^0.20.2
  uuid: ^4.5.1                    # M8 — unique file IDs for voice uploads

  # State management
  flutter_riverpod: ^2.6.1

  # UI / Design
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
